spring.application.name=JobPortal
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.uri=mongodb://localhost:27017/jobportal

# Logging Configuration
spring.output.ansi.enabled=ALWAYS
logging.level.root=INFO
logging.level.org.mongodb.driver=WARN
logging.level.org.springframework.data.mongodb.core=WARN
logging.level.org.springframework.web=INFO
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

USER_FOUND = User has already registered.
USER_NOT_FOUND = User has not registered.
INVALID_CREDENTIALS = Invalid Credentials.
OTP_NOT_FOUND = OTP is expired.
INVALID_OTP = Incorrect OTP.
JOB_NOT_FOUND = Job is not found.
JOB_APPLIED_ALREADY = Job applied already.

